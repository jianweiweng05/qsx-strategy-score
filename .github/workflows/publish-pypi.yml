name: Publish verified core to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-qsx-score-free
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f278490f49f9fadc5c63b29dd3417191065544fb
          fetch-depth: 0
      - name: Verify the approved source is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          python -m pip install dist/*.whl
          python - <<'PY'
          import importlib.metadata
          import hashlib
          import re
          import tarfile
          import urllib.error
          import urllib.request
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path

          assert importlib.metadata.version('qsx-score-free') == '0.4.0'
          wheel, = Path('dist').glob('*.whl')
          with zipfile.ZipFile(wheel) as archive:
              metadata_name, = (n for n in archive.namelist() if n.endswith('.dist-info/METADATA'))
              metadata = BytesParser().parsebytes(archive.read(metadata_name))
          assert metadata['Name'] == 'qsx-score-free'
          assert metadata['Version'] == '0.4.0'
          for distribution in sorted(Path('dist').iterdir()):
              if distribution.suffix == '.whl':
                  with zipfile.ZipFile(distribution) as archive:
                      entries = [(n, archive.read(n)) for n in archive.namelist() if not n.endswith('/')]
              else:
                  with tarfile.open(distribution) as archive:
                      entries = [(m.name, archive.extractfile(m).read()) for m in archive.getmembers() if m.isfile()]
                  package_info, = (data for name, data in entries if name.endswith('/PKG-INFO') and name.count('/') == 1)
                  sdist_metadata = BytesParser().parsebytes(package_info)
                  assert sdist_metadata['Name'] == 'qsx-score-free'
                  assert sdist_metadata['Version'] == '0.4.0'
              for name, data in entries:
                  assert not Path(name).is_absolute() and '..' not in Path(name).parts
                  assert not {'.git', '.venv', '.env', '.pypirc', '.ssh', '.aws'}.intersection(Path(name).parts)
                  text = data.decode('utf-8', errors='replace')
                  assert not re.search(r'/Users/admin|/home/admin|\bpypi-[A-Za-z0-9_-]{20,}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----', text), name
              print(distribution.name, hashlib.sha256(distribution.read_bytes()).hexdigest())
          try:
              with urllib.request.urlopen('https://pypi.org/pypi/qsx-score-free/0.4.0/json', timeout=20):
                  raise SystemExit('Version already exists; no upload is allowed')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          PY
          qsx-score --version
          qsx-score examples/sample_returns.csv --profile other --no-auto-asset --lang en
      - uses: actions/upload-artifact@v4
        with:
          name: qsx-score-free-0.4.0
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qsx-score-free/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qsx-score-free-0.4.0
          path: dist/
      - name: Publish using the project-bound trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
